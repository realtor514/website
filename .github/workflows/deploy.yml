name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.0"
          extended: true

      # Les versions WebP reduites des images (partiel img.html) prennent
      # environ une minute et demie a produire la premiere fois. Hugo les
      # retrouve ici d un deploiement a l autre et ne refait que les nouvelles.
      - name: Cache des images traitees
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-gen-${{ hashFiles('static/images/**') }}
          restore-keys: hugo-gen-

      - name: Build site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
